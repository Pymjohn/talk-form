<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>离线</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0f172a;color:#e2e8f0;font:16px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .box{max-width:300px;text-align:center;padding:0 24px}
  h1{font-size:20px;margin:0 0 10px}
  p{color:#94a3b8;font-size:13px;margin:0 0 18px}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#2563eb;color:#fff;
         font-size:15px;font-weight:600}
  small{display:block;margin-top:16px;color:#64748b;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <h1>连不上服务器</h1>
  <p>请确认 Tailscale 已开启，或手机网络正常。</p>
  <button onclick="location.reload()">重试</button>
  <small>后台提醒服务不受影响，仍会继续接收通知</small>
</div>
</body>
</html>
